
name: Build Fire TV test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract Midnight Neon project
        run: |
          mkdir -p project
          unzip -q phase10-midnight-neon-prototype.zip -d project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android 35 platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Midnight Neon APK
        run: gradle --no-daemon -p project/phase10-midnight-neon/android assembleDebug

      - name: Upload Midnight Neon APK
        uses: actions/upload-artifact@v4
        with:
          name: phase10-midnight-neon-apk
          path: project/phase10-midnight-neon/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
