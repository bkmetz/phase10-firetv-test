
name: Build Phase 10 Live Fire TV APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract new Fire TV app
        run: |
          mkdir -p extracted
          unzip -q phase10-tv-live-source.zip -d extracted

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Fire TV APK
        run: gradle --no-daemon -p extracted/phase10-midnight-neon/android assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: phase10-live-tv-apk
          path: extracted/phase10-midnight-neon/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
